[env:esp32balcony]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SHTC3 Library@^1.0.0
    knolleary/PubSubClient@^2.8
lib_extra_dirs = ../esp32-shared


[env:esp32balcony-ota]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit SHTC3 Library@^1.0.0
    knolleary/PubSubClient@^2.8
lib_extra_dirs = ../esp32-shared

upload_protocol = espota
upload_port = 192.168.1.12
upload_flags = 
    --auth=900731